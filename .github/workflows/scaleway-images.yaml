name: Scaleway images

# Every push to main (merges included) builds the images whose code changed
# since the tags recorded in deploy/scaleway/images.yaml, tags them with the
# commit hash, and records the new tags there. Argo CD follows this branch and
# rolls out whatever images.yaml names. The record commit is pushed with
# GITHUB_TOKEN, which doesn't start workflows, so this doesn't loop.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time, so record commits don't race. A run dropped while queued
# is covered by the next one: changes are measured from the recorded tags, not
# from the previous push.
concurrency:
  group: scaleway-images
  cancel-in-progress: false

env:
  IMAGES_FILE: deploy/scaleway/images.yaml

jobs:
  changes:
    # Only the monneDev fork deploys to Scaleway; anywhere else (upstream, other
    # forks) the whole workflow is skipped.
    if: github.repository == 'monneDev/OS2fleetoptimiser'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      components: ${{ steps.detect.outputs.components }}
    steps:
      # The branch tip, not the pushed commit: an earlier run may have recorded
      # newer tags since.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Find the images to rebuild
        id: detect
        run: |
          # A component is rebuilt when its recorded tag is empty or unknown,
          # or when its files changed between that commit and this one.
          declare -A paths=(
            [backend]="fleetmanager Dockerfile .dockerignore pyproject.toml poetry.lock build-constraints.txt"
            [frontend]="fleetoptimiser-frontend"
          )
          components=()
          for c in backend frontend; do
            tag=$(yq ".${c}.image.tag // \"\"" "$IMAGES_FILE")
            # shellcheck disable=SC2086 # paths are space-separated on purpose
            if [ -z "$tag" ] || ! git cat-file -e "${tag}^{commit}" 2>/dev/null ||
              ! git diff --quiet "$tag" "$GITHUB_SHA" -- ${paths[$c]}; then
              components+=("$c")
            fi
          done
          echo "components=$(jq -cn '$ARGS.positional' --args "${components[@]}")" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: actions/checkout@v7

      # Image names must be lowercase; the owner (monneDev) isn't.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fleetoptimiser-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Log into registry ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The cluster's nodes are amd64.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64
          context: ${{ matrix.component == 'frontend' && 'fleetoptimiser-frontend' || '.' }}
          file: ${{ matrix.component == 'frontend' && 'fleetoptimiser-frontend/Dockerfile' || 'Dockerfile' }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  record:
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Record the new tags
        env:
          COMPONENTS: ${{ needs.changes.outputs.components }}
        run: |
          for c in $(jq -r '.[]' <<<"$COMPONENTS"); do
            yq -i ".${c}.image.tag = \"$GITHUB_SHA\"" "$IMAGES_FILE"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy/scaleway): $(jq -r 'join(" and ")' <<<"$COMPONENTS") images at ${GITHUB_SHA::7}"
          for _ in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
