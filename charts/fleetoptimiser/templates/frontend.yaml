{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleetoptimiser.fullname" . }}-frontend
  labels:
    {{- include "fleetoptimiser.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "fleetoptimiser.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      {{- with .Values.frontend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "fleetoptimiser.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 8 }}
        {{- with include "fleetoptimiser.meshPodLabels" (dict "root" . "component" "frontend") }}
        {{- . | trim | nindent 8 }}
        {{- end }}
        {{- with .Values.frontend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "fleetoptimiser.serviceAccountName" (dict "root" . "component" "frontend") }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ printf "%s:%s" .Values.frontend.image.repository (.Values.frontend.image.tag | default .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: BACKEND_URL
              value: {{ default (printf "http://%s-backend:%v" (include "fleetoptimiser.fullname" .) .Values.backend.service.port) .Values.frontend.backendUrl | quote }}
            - name: KEYCLOAK_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "frontend.auth.existingSecret is required" .Values.frontend.auth.existingSecret }}
                  key: {{ .Values.frontend.auth.keys.clientId }}
            - name: KEYCLOAK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontend.auth.existingSecret }}
                  key: {{ .Values.frontend.auth.keys.clientSecret }}
            - name: KEYCLOAK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontend.auth.existingSecret }}
                  key: {{ .Values.frontend.auth.keys.issuer }}
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontend.auth.existingSecret }}
                  key: {{ .Values.frontend.auth.keys.authSecret }}
            - name: BETTER_AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontend.auth.existingSecret }}
                  key: {{ .Values.frontend.auth.keys.authUrl }}
            {{- if .Values.frontend.roleCheck }}
            - name: ROLE_CHECK
              value: {{ .Values.frontend.roleCheck | quote }}
            {{- end }}
            {{- if .Values.frontend.roleCheckRead }}
            - name: ROLE_CHECK_READ
              value: {{ .Values.frontend.roleCheckRead | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleetoptimiser.fullname" . }}-frontend
  labels:
    {{- include "fleetoptimiser.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "fleetoptimiser.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
