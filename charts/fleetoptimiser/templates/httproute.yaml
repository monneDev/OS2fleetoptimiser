{{- if .Values.httpRoute.enabled }}
{{- if not .Values.frontend.enabled }}
{{- fail "httpRoute.enabled requires frontend.enabled" }}
{{- end }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.parentRefs is required when httpRoute.enabled" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "fleetoptimiser.fullname" . }}-frontend
  labels:
    {{- include "fleetoptimiser.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "fleetoptimiser.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port }}
{{- end }}
