{{- if .Values.vpa.enabled }}
{{- range $component := list "backend" "frontend" "worker" }}
{{- if (index $.Values $component).enabled }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "fleetoptimiser.fullname" $ }}-{{ $component }}
  labels:
    {{- include "fleetoptimiser.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fleetoptimiser.fullname" $ }}-{{ $component }}
  updatePolicy:
    updateMode: {{ $.Values.vpa.updateMode | quote }}
{{- end }}
{{- end }}
{{- end }}
