{{- if and .Values.secret.create .Values.vault.enabled }}
{{- fail "secret.create and vault.enabled are mutually exclusive" }}
{{- end }}
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleetoptimiser.secretName" . }}
  labels:
    {{- include "fleetoptimiser.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-password: {{ required "secret.values.databasePassword is required" .Values.secret.values.databasePassword | quote }}
  rabbitmq-password: {{ required "secret.values.rabbitmqPassword is required" .Values.secret.values.rabbitmqPassword | quote }}
  valkey-password: {{ required "secret.values.valkeyPassword is required" .Values.secret.values.valkeyPassword | quote }}
  keycloak-id: {{ required "secret.values.keycloakClientId is required" .Values.secret.values.keycloakClientId | quote }}
  keycloak-secret: {{ required "secret.values.keycloakClientSecret is required" .Values.secret.values.keycloakClientSecret | quote }}
  keycloak-issuer: {{ required "secret.values.keycloakIssuer is required" .Values.secret.values.keycloakIssuer | quote }}
  better-auth-secret: {{ required "secret.values.betterAuthSecret is required" .Values.secret.values.betterAuthSecret | quote }}
  better-auth-url: {{ required "secret.values.betterAuthUrl is required" .Values.secret.values.betterAuthUrl | quote }}
{{- end }}
