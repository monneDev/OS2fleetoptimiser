{{- if .Values.vault.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ include "fleetoptimiser.fullname" . }}
  labels:
    {{- include "fleetoptimiser.labels" . | nindent 4 }}
spec:
  method: kubernetes
  mount: {{ .Values.vault.mount }}
  kubernetes:
    role: {{ required "vault.authRole is required" .Values.vault.authRole }}
    serviceAccount: {{ include "fleetoptimiser.serviceAccountName" (dict "root" . "component" "backend") }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "fleetoptimiser.secretName" . }}
  labels:
    {{- include "fleetoptimiser.labels" . | nindent 4 }}
spec:
  type: kv-v2
  mount: {{ .Values.vault.kvMount }}
  path: {{ required "vault.secretPath is required" .Values.vault.secretPath }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  vaultAuthRef: {{ include "fleetoptimiser.fullname" . }}
  destination:
    name: {{ include "fleetoptimiser.secretName" . }}
    create: true
    overwrite: true
    transformation:
      excludeRaw: false
  {{- if .Values.vault.rolloutRestart }}
  rolloutRestartTargets:
    {{- if .Values.backend.enabled }}
    - kind: Deployment
      name: {{ include "fleetoptimiser.fullname" . }}-backend
    {{- end }}
    {{- if .Values.frontend.enabled }}
    - kind: Deployment
      name: {{ include "fleetoptimiser.fullname" . }}-frontend
    {{- end }}
    {{- if .Values.worker.enabled }}
    - kind: Deployment
      name: {{ include "fleetoptimiser.fullname" . }}-worker
    {{- end }}
  {{- end }}
{{- end }}
