{{- if .Values.serviceAccount.create }}
{{- range $component := list "backend" "frontend" "worker" }}
{{- if (index $.Values $component).enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fleetoptimiser.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "fleetoptimiser.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $.Values.serviceAccount.automount }}
{{- end }}
{{- end }}
{{- end }}
