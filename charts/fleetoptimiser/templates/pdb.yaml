{{- if .Values.pdb.enabled }}
{{- range $component := list "backend" "frontend" "worker" }}
{{- if (index $.Values $component).enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fleetoptimiser.fullname" $ }}-{{ $component }}
  labels:
    {{- include "fleetoptimiser.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  minAvailable: {{ $.Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "fleetoptimiser.componentSelectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
